name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline script
        run: python Scripts/Weather_data_pipline.py

      - name: Check if CSV files changed
        id: file_changes
        run: |
          # Check for changes in CSV files
          git diff --exit-code Data/processed_data.csv Data/cleaned_data.csv || echo "Files have changed."

      - name: Commit and push changes (if any)
        run: |
          # Add only the modified CSV files
          git add Data/processed_data.csv Data/cleaned_data.csv
          git commit -m "Auto-update data CSVs: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          # Pull latest changes with rebase to avoid push conflicts
          git pull --rebase origin main
          git push origin main

      - name: Upload updated CSVs as artifacts (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: updated-csvs
          path: |
            Data/processed_data.csv
            Data/cleaned_data.csv
