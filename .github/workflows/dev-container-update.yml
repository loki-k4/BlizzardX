name: Rebuild Dev Container on .devcontainer.json Changes

on:
  push:
    paths:
      - '.devcontainer/Python/devcontainer.json'
  pull_request:
    paths:
      - '.devcontainer/Python/devcontainer.json'

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Trigger Codespace rebuild
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/codespaces/rebuild \
          -d '{"codespace_name": "${{ github.actor }}-codespace"}'
