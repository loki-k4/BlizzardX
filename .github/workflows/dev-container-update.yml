name: Rebuild Dev Container

on:
  push:
    paths:
      - '.devcontainer/Python/devcontainer.json'  # Trigger rebuild only when .devcontainer.json changes
  pull_request:
    paths:
      - '.devcontainer/Python/devcontainer.json'  # Trigger rebuild on pull request changes to .devcontainer.json

jobs:
  rebuild:
    runs-on: ubuntu-latest  # You can change this depending on your preferred runner type (e.g., macos-latest)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      with:
        version: latest
    
    - name: Cache Docker layers
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Build dev container image from Dockerfile
      run: |
        docker build --cache-from=type=local,src=/tmp/.buildx-cache --cache-to=type=local,dest=/tmp/.buildx-cache -t mydevcontainer:latest -f Dockerfile .

    - name: Tag dev container image with version number
      run: |
        version=$(date +%Y%m%d%H%M%S)
        docker tag mydevcontainer:latest mydevcontainer:$version

    - name: Trigger Codespace rebuild
      run: |
        curl -X POST \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/codespaces/rebuild \
          -d '{"codespace_name": "${{ github.actor }}-codespace"}'
